spring.application.name=cidade-tech
spring.profiles.default=demo
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false
spring.cache.cache-names=temas,resultados
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=Cidade Tech
info.app.version=1.0.0
app.jwt.secret=${JWT_SECRET:}
app.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8081,http://127.0.0.1:3000}
spring.data.web.pageable.max-page-size=50
spring.jackson.deserialization.fail-on-numbers-for-enums=true
springdoc.show-actuator=true
springdoc.cache.disabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoint.health.probes.enabled=true
