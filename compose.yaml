services:
  banco:
    image: postgres:17
    environment:
      POSTGRES_DB: empauta
      POSTGRES_USER: empauta
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empauta -d empauta"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://banco:5432/empauta
      DB_USER: empauta
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      GESTOR_INICIAL_EMAIL: ${GESTOR_INICIAL_EMAIL:-}
      GESTOR_INICIAL_SENHA: ${GESTOR_INICIAL_SENHA:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      banco:
        condition: service_healthy
volumes:
  banco:
